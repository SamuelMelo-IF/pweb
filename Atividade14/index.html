<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 14</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Transparências, Sombras e Gradientes</h1>

    <h2>Transparência (opacity)</h2>

    <div class="box opacity">
        <img src="img/camera.png" alt="Câmera">
    </div>

    <h2>Transparência usando RGBA</h2>

    <div class="box rgba">
        <p>Este texto está dentro de uma caixa usando RGBA.</p>
    </div>

    <h2>Sombras</h2>

    <div class="box sombra">
        Caixa com sombra
    </div>

    <h2>Gradiente Linear</h2>

    <div class="box gradiente-linear"></div>

    <h2>Gradiente Radial</h2>

    <div class="box gradiente-radial"></div>

</body>
</html>
