<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 17 – Galeria Grid Bootstrap</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-4">

    <div class="container container-galeria">
        
        <div class="row g-3">
            
            <div class="col-md-6">
                <img src="fotos/gato.jpg" alt="Gato Grande" class="img-fluid img-galeria h-100 object-fit-cover">
            </div>
            
            <div class="col-md-6">
                
                <div class="row g-3 mb-3">
                    <div class="col-12">
                        <img src="fotos/gato 1.jpg" alt="Gato Comprido" class="img-fluid img-galeria object-fit-cover">
                    </div>
                </div>
                
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <img src="fotos/gato 2.jpg" alt="Gato Médio 1" class="img-fluid img-galeria object-fit-cover">
                    </div>
                    <div class="col-6">
                        <img src="fotos/gato 3.jpg" alt="Gato Médio 2" class="img-fluid img-galeria object-fit-cover">
                    </div>
                </div>
                
                <div class="row g-3">
                    <div class="col-4">
                        <img src="fotos/gato 4.jpg" alt="Gato Pequeno 1" class="img-fluid img-galeria object-fit-cover">
                    </div>
                    <div class="col-4">
                        <img src="fotos/gato 5.jpg" alt="Gato Pequeno 2" class="img-fluid img-galeria object-fit-cover">
                    </div>
                    <div class="col-4">
                        <img src="fotos/gato 7.jpg" alt="Gato Pequeno 3" class="img-fluid img-galeria object-fit-cover">
                    </div>
                </div>

            </div> </div> </div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
